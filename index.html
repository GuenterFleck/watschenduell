<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Watschnduell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: Wirtshausschild oben, Almbühne in der Mitte, Schlagkarte darunter. Eine feste, dunkle Fichtenwelt. */
:root{
  color-scheme:dark;
  --fichte:#13221a; --loden:#1f3428; --loden-hell:#2a4636; --rand:#3d5c49;
  --milch:#f2eddd; --leise:#a8b9a6;
  --kuerbis:#f08a24; --enzian:#4f83e6; --almrausch:#e2496b; --wiese:#7cc04f;
  --display:"Grenze Gotisch","Old English Text MT",Georgia,serif;
  --text:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--fichte);color:var(--milch);font-family:var(--text);font-size:15px;line-height:1.45;
  padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,52px);line-height:.95;margin:0;color:var(--kuerbis);letter-spacing:.5px}
.sub{margin:4px 0 0;color:var(--leise);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.kopf-rechts{display:flex;align-items:center;gap:10px}
#stand{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--milch)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--kuerbis);outline-offset:2px}
.klein{background:transparent;border:1px solid var(--rand);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.klein:hover{background:var(--loden)}

/* HUD */
.hud{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seite{min-width:0;display:flex;flex-direction:column;gap:4px}
.seite.r{text-align:right}
.name{font-family:var(--display);font-weight:600;font-size:22px;line-height:1}
.name small{font-family:var(--text);font-size:11px;color:var(--leise);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.seite.r .name small{margin:0 6px 0 0}
.leiste{height:14px;background:var(--loden);border:1px solid var(--rand);border-radius:4px;overflow:hidden;position:relative}
.leiste i{display:block;height:100%;width:100%;background:var(--almrausch);transition:width .35s ease}
.leiste.sp{height:8px}.leiste.sp i{background:var(--enzian);width:0}
.leiste.sp.voll i{background:var(--kuerbis)}
.seite.r .leiste i{margin-left:auto}
.zahl{font-size:12px;color:var(--leise);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:4px;flex-wrap:wrap;min-height:20px}
.seite.r .chips{justify-content:flex-end}
.chip{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--loden-hell);border:1px solid var(--rand)}
.chip.gut{border-color:var(--wiese);color:var(--wiese)}

/* Bühne */
.buehne{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;border:2px solid var(--rand);background:#9ccdf0}
.buehne>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.kaempfer{position:absolute;bottom:4%;width:21%}
.kaempfer.l{left:13%}.kaempfer.r{right:13%}
.kaempfer .figur svg{display:block;width:100%;height:auto}
.kaempfer.r .figur{transform:scaleX(-1)}
.blase{position:absolute;bottom:98%;left:50%;transform:translateX(-50%) scale(.6);opacity:0;transition:opacity .15s,transform .15s;
  background:#fffdf4;color:#1c1a14;font-weight:700;font-size:clamp(11px,2.4vw,15px);line-height:1.2;padding:6px 10px;border-radius:12px;
  width:max-content;max-width:190%;text-align:center;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.blase.an{opacity:1;transform:translateX(-50%) scale(1)}
#muh{bottom:auto;top:36%;left:50%;font-size:clamp(10px,2vw,13px);padding:3px 8px}
.proj{position:absolute;font-size:clamp(22px,6vw,40px);line-height:1;transform:translate(-50%,-50%);pointer-events:none}
.proj.oel{width:5%;aspect-ratio:1;border-radius:60% 40% 55% 45%;background:#2a3310;border:2px solid #485a16}
.schweb{position:absolute;top:30%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:clamp(24px,6vw,40px);
  color:#fff;text-shadow:0 2px 0 #7a1730,0 0 8px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap}
.schweb.heil{text-shadow:0 2px 0 #245c1c,0 0 8px rgba(0,0,0,.5)}
.schweb.fehl{font-size:clamp(18px,4.5vw,28px);text-shadow:0 2px 0 #333}
.lawine{position:absolute;bottom:2%;width:34%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fff,#dfeaf2 60%,#b9cad6)}
.blitz{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  background:rgba(13,24,18,.78);padding:16px}
.banner h2{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,64px);margin:0;line-height:1;color:var(--kuerbis);text-wrap:balance}
.banner p{margin:0;max-width:34em;font-size:clamp(13px,2.6vw,16px)}
.banner .reihe{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.haupt{background:var(--kuerbis);color:#22130a;border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-size:15px}
.haupt:hover{filter:brightness(1.08)}

/* Schlagkarte */
#log{min-height:44px;background:var(--loden);border:1px solid var(--rand);border-radius:8px;padding:10px 14px;font-weight:600}
.aktionen{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.akt{min-width:0;text-align:left;background:var(--loden);border:1px solid var(--rand);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.akt:hover:not(:disabled){background:var(--loden-hell);border-color:var(--kuerbis)}
.akt:disabled{opacity:.5;cursor:not-allowed}
.akt b{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.05}
.akt span{font-size:13px;color:var(--leise)}
.akt em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--milch);font-variant-numeric:tabular-nums}
.akt.spezial{border-color:var(--enzian)}
.akt.spezial.bereit{border-color:var(--kuerbis);background:#3b2a12}
.akt.spezial.bereit b{color:var(--kuerbis)}

.timing{display:flex;flex-direction:column;gap:10px;background:var(--loden);border:1px solid var(--rand);border-radius:8px;padding:12px 14px}
.timing p{margin:0;font-size:13px;color:var(--leise)}
.spur{position:relative;height:30px;background:#0e1913;border:1px solid var(--rand);border-radius:6px;overflow:hidden}
.spur .zt,.spur .zk{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%)}
.spur .zt{background:#3f6b3a;width:var(--t)}
.spur .zk{background:var(--kuerbis);width:var(--k)}
.spur .zeiger{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2.5px;background:#fff;border-radius:2px;box-shadow:0 0 6px rgba(255,255,255,.7)}
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--leise)}
.legende i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#hau{align-self:stretch;font-size:18px;padding:12px}

.wahl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.karte{min-width:0;background:var(--loden);border:1px solid var(--rand);border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.karte:hover{border-color:var(--kuerbis);background:var(--loden-hell)}
.karte svg{width:min(120px,60%);height:auto}
.karte b{font-family:var(--display);font-weight:600;font-size:26px;line-height:1}
.karte span{font-size:13px;color:var(--leise)}
.frage{margin:0;font-weight:600}
@media (max-width:520px){
  .buehne{aspect-ratio:4/3}
  .aktionen{grid-template-columns:1fr}
  .name{font-size:19px}
  .name small{display:block;margin:2px 0 0}
  .seite.r .name small{margin:2px 0 0}
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Watschnduell</h1>
      <p class="sub">Osttirol gegen Oststeiermark</p>
    </div>
    <div class="kopf-rechts">
      <span id="stand"></span>
      <button class="klein" id="ton" type="button">Ton aus</button>
    </div>
  </header>

  <div class="hud" id="hud">
    <div class="seite l">
      <div class="name" id="n0"></div>
      <div class="leiste"><i id="hp0"></i></div>
      <div class="leiste sp" id="spb0"><i id="sp0"></i></div>
      <div class="zahl" id="z0"></div>

    <div class="seite r">
      <div class="name" id="n1"></div>
      <div class="leiste"><i id="hp1"></i></div>
      <div class="leiste sp" id="spb1"><i id="sp1"></i></div>
      <div class="zahl" id="z1"></div>
      <div class="chips" id="c1"></div>

  <div class="buehne" id="buehne">
    <svg class="bg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs><linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fbbea"/><stop offset="1" stop-color="#dff1f8"/></linearGradient></defs>
      <rect width="800" height="450" fill="url(#himmel)"/>

      <path d="M330 70 L296 122 L318 112 L334 132 L352 110 L368 126 Z" fill="#ffffff"/>
      <path d="M120 150 L98 180 L118 174 L136 188 Z" fill="#ffffff"/>
      <path d="M470 130 L452 156 L470 150 L486 164 Z" fill="#ffffff"/>
      <path d="M0 330 Q200 250 400 320 T800 300 V450 H0Z" fill="#4d7f55"/>

      <g>
        <rect x="560" y="296" width="62" height="36" fill="#7a5433"/>
        <path d="M552 298 L591 268 L630 298Z" fill="#4a3220"/>
        <rect x="584" y="312" width="14" height="20" fill="#2e1f14"/>
      </g>
      <g id="kuh">
        <rect x="372" y="352" width="6" height="22" fill="#f4f1e8"/><rect x="386" y="352" width="6" height="22" fill="#f4f1e8"/>
        <rect x="412" y="352" width="6" height="22" fill="#f4f1e8"/><rect x="424" y="352" width="6" height="22" fill="#f4f1e8"/>
        <ellipse cx="400" cy="342" rx="36" ry="18" fill="#f4f1e8"/>
        <ellipse cx="392" cy="338" rx="12" ry="8" fill="#6b4a2f"/><ellipse cx="418" cy="348" rx="8" ry="6" fill="#6b4a2f"/>
        <ellipse cx="440" cy="330" rx="13" ry="11" fill="#f4f1e8"/>

        <path d="M430 320 l-6 -7 l8 3z" fill="#d8d2c0"/><path d="M448 320 l6 -7 l-8 3z" fill="#d8d2c0"/>
        <rect x="436" y="341" width="8" height="8" rx="2" fill="#d9a520"/>
      </g>
    </svg>
    <div class="blase" id="muh"></div>
    <div class="kaempfer l" id="k0"><div class="blase" id="b0"></div><div class="figur" id="f0"></div></div>
    <div class="kaempfer r" id="k1"><div class="blase" id="b1"></div><div class="figur" id="f1"></div></div>
    <div class="blitz" id="blitz"></div>
    <div class="banner" id="banner" hidden></div>
  </div>

  <div id="log" role="status" aria-live="polite">Such dir aus, für wen du zuhaust.</div>

  <div id="wahlbox">
    <div class="wahl">
      <button class="karte" id="wahl-tirol" type="button"><span id="wf-tirol"></span><b>Osttiroler</b><span>Watschn, Schlipfkrapfen, Kuhglocke und ein Jodler, der Lawinen auslöst.</span></button>
      <button class="karte" id="wahl-steier" type="button"><span id="wf-steier"></span><b>Oststeirer</b><span>Äpfel, Kernöl, Kürbis und eine Brettljause zum Auftanken.</span></button>
    </div>
  </div>

  <div class="aktionen" id="aktionen" hidden></div>

  <div class="timing" id="timing" hidden>
    <p id="thin"></p>
    <div class="spur" id="spur"><div class="zt"></div><div class="zk"></div><div class="zeiger" id="zeiger"></div></div>
    <div class="legende"><span><i style="background:var(--kuerbis)"></i>Volltreffer</span><span><i style="background:#3f6b3a"></i>Treffer</span><span><i style="background:#0e1913;border:1px solid var(--rand)"></i>daneben</span></div>
    <button class="haupt" id="hau" type="button">Zuhauen (Leertaste)</button>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

const NAME={tirol:'Osttiroler',steier:'Oststeirer'};
const MOVES={
 tirol:[
  {name:'Watschn',desc:'Schwach, trifft aber fast immer.',dmg:10,diff:0,sfx:'slap'},
  {name:'Schlipfkrapfen-Wurf',desc:'Verklebt den Gegner: sein nächster Schlag ist nur halb so stark.',dmg:14,diff:1,proj:'🥟',fx:'half',fxName:'verklebt',face:'krapfen',sfx:'plop'},
  {name:'Kuhglocken-Schwinger',desc:'Stark, aber schwer zu treffen. Das Gebimmel stört sein nächstes Zielen.',dmg:22,diff:2,proj:'🔔',fx:'shaky',fxName:'Gebimmel',sfx:'bell'},
  {name:'Großglockner-Jodler',desc:'Löst eine Lawine aus. Trifft immer.',dmg:34,special:'lawine'}
 ],
 steier:[
  {name:'Apfel-Salve',desc:'Schwach, trifft aber fast immer.',dmg:10,diff:0,proj:'🍎',multi:3,sfx:'plop'},
  {name:'Kernöl-Spritzer',desc:'Macht den Gegner rutschig: sein nächstes Zielen wird schwerer. Der Fleck bleibt.',dmg:12,diff:1,proj:'oel',fx:'shaky',fxName:'rutschig',oil:true,sfx:'plop'},
  {name:'Kürbis-Kopfnuss',desc:'Stark, aber schwer zu treffen. Mit Kürbis am Kopf schlägt er nur halb so fest.',dmg:22,diff:2,proj:'🎃',fx:'half',fxName:'Kürbis am Kopf',face:'pumpkin',sfx:'slap'},
  {name:'Buschenschank',desc:'Brettljause heilt 22 Schneid, der Schilcher verdoppelt den nächsten Schlag.',heal:22,special:'schank'}
 ]
};
const DIFF=['leicht','mittel','schwer'];
const HITW=[.6,.44,.3], CRITW=[.16,.12,.09];
const SPOTT={
 tirol:['Du Flachlandler!','Kimm lei her!','Hosch du schon amol an Berg gsehn?','Bei ins hat a jeder Stoan mehr Schneid!','Iatz wersch schaugn!'],
 steier:['Bei uns wochst wenigstens wos!','Geh hoam zu deine Stoana!','I richt di her wia an Salat!','Du host jo mehr Küah wia Nochborn!','Na woart, Bürscherl!']
};
const AUA=['Au weh!','Heast!','Sakra!','Jessas!','Zefix!','Bist deppat?'];

/* ---------- Zustand ---------- */
let S;
function neu(kind){return {kind,hp:100,sp:0,half:false,shaky:false,dbl:false,oil:false,face:null,minHp:100}}
function frisch(pick){
  const other=pick==='tirol'?'steier':'tirol';
  S={pick,round:1,wins:[0,0],turns:0,busy:true,f:[neu(pick||'tirol'),neu(pick?other:'steier')]};
}

/* ---------- Figuren ---------- */
function figur(f,ko){
  const T=f.kind==='tirol', skin='#f2c9a0';
  const lvl=f.minHp<25?3:f.minHp<50?2:f.minHp<75?1:0;
  const hemd=T?'#f4f1e6':'#8b9189', hose=T?'#7a4a25':'#2b2b2b', sock=T?'#eee9dc':'#3f7d4a', hut=T?'#6f7672':'#2f6b3c', band=T?'#b3262e':'#1d3f25';
  let s='<svg viewBox="0 -14 120 224" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+NAME[f.kind]+'">';
  s+='<ellipse cx="60" cy="203" rx="38" ry="6" fill="rgba(0,0,0,.25)"/>';
  s+='<rect x="34" y="190" width="24" height="11" rx="4" fill="#3b2a1e"/><rect x="62" y="190" width="24" height="11" rx="4" fill="#3b2a1e"/>';
  s+='<rect x="38" y="160" width="14" height="32" fill="'+sock+'"/><rect x="66" y="160" width="14" height="32" fill="'+sock+'"/>';
  s+='<rect x="38" y="144" width="14" height="18" fill="'+skin+'"/><rect x="66" y="144" width="14" height="18" fill="'+skin+'"/>';
  s+='<path d="M30 106 h60 v42 h-26 l-4 -14 l-4 14 h-26z" fill="'+hose+'"/>';
  s+='<rect x="22" y="68" width="12" height="40" rx="6" fill="'+hemd+'"/><circle cx="28" cy="110" r="7" fill="'+skin+'"/>';
  s+='<rect x="30" y="64" width="60" height="50" rx="10" fill="'+hemd+'"/>';
  if(T){s+='<rect x="38" y="64" width="6" height="46" fill="#b3262e"/><rect x="76" y="64" width="6" height="46" fill="#b3262e"/><rect x="38" y="82" width="44" height="6" fill="#b3262e"/>';}
  else{s+='<path d="M50 64 L60 86 L70 64Z" fill="#2f6b3c"/><circle cx="60" cy="94" r="2.5" fill="#d9a520"/><circle cx="60" cy="104" r="2.5" fill="#d9a520"/>';}
  if(f.oil)s+='<path d="M44 84 q10 -8 20 2 q12 6 3 17 q-9 10 -21 3 q-10 -8 -2 -22z" fill="#2a3310"/><circle cx="72" cy="108" r="3" fill="#2a3310"/>';
  s+='<path d="M84 74 L104 60" stroke="'+hemd+'" stroke-width="12" stroke-linecap="round" fill="none"/><circle cx="107" cy="57" r="7" fill="'+skin+'"/>';
  if(f.face==='pumpkin'){
    s+='<ellipse cx="60" cy="36" rx="31" ry="27" fill="#f08a24"/><path d="M60 10 v52 M44 14 q-8 22 0 44 M76 14 q8 22 0 44" stroke="#c2661a" stroke-width="2" fill="none"/>';
    s+='<rect x="56" y="2" width="8" height="10" rx="2" fill="#4c7a2c"/><path d="M48 32 l6 -8 l6 8z M62 32 l6 -8 l6 8z" fill="#3b1d05"/><path d="M48 46 h26 l-4 6 h-18z" fill="#3b1d05"/>';
  }else{
    s+='<circle cx="60" cy="42" r="24" fill="'+skin+'"/>';
    if(lvl>=2)s+='<circle cx="45" cy="17" r="8" fill="#e98a8a"/>';
    if(T)s+='<path d="M37 46 q23 36 46 0 q-3 23 -23 25 q-20 -2 -23 -25z" fill="#6b4a2f"/>';
    if(lvl>=1)s+='<circle cx="70" cy="38" r="8" fill="#6b4a8c" opacity=".75"/>';
    if(ko){s+='<path d="M50 34 l8 8 M58 34 l-8 8 M66 34 l8 8 M74 34 l-8 8" stroke="#22201c" stroke-width="2.5" stroke-linecap="round" fill="none"/>';}
    else{s+='<circle cx="54" cy="38" r="3" fill="#22201c"/><circle cx="70" cy="38" r="3" fill="#22201c"/>';}
    if(!T)s+='<path d="M47 50 q7 -6 13 0 q6 -6 13 0 q-7 6 -13 2 q-6 4 -13 -2z" fill="#4a3524"/>';
    s+=(lvl>=2||ko)?'<path d="M55 58 q6 -5 12 0" stroke="#2a1a12" stroke-width="2.5" stroke-linecap="round" fill="none"/>':'<path d="M55 55 q6 5 12 0" stroke="#2a1a12" stroke-width="2.5" stroke-linecap="round" fill="none"/>';
    if(lvl>=3)s+='<rect x="74" y="46" width="14" height="6" rx="2" fill="#f7e6c8" transform="rotate(35 81 49)"/>';
    if(f.face==='krapfen')s+='<path d="M44 46 a18 13 0 0 1 36 0z" fill="#ecd9a6" stroke="#c9ad6a" stroke-width="2"/><path d="M48 46 v-3 M54 46 v-3 M60 46 v-3 M66 46 v-3 M72 46 v-3" stroke="#c9ad6a" stroke-width="2" fill="none"/>';
    s+='<g transform="rotate('+(lvl>=2?16:0)+' 60 22)"><ellipse cx="60" cy="23" rx="33" ry="6" fill="'+hut+'"/><path d="M40 23 q2 -23 20 -23 q18 0 20 23z" fill="'+hut+'"/><rect x="41" y="16" width="38" height="5" fill="'+band+'"/>';
    s+=T?'<path d="M76 16 q11 -18 4 -27 q-9 9 -8 27z" fill="#ffffff"/>':'<path d="M72 16 l2 -22 l3 20 l3 -24 l3 22 l2 -18 l1 22z" fill="#d8d2c0"/>';
    s+='</g>';
  }
  if(ko)s+='<text x="26" y="6" font-size="16" fill="#ffe26a">✦</text><text x="56" y="-2" font-size="16" fill="#ffe26a">✦</text><text x="86" y="6" font-size="16" fill="#ffe26a">✦</text>';
  return s+'</svg>';
}

/* ---------- Ton ---------- */
let ac=null,master=null,laut=true,musik=null,schritt=0,naechste=0;
try{laut=localStorage.getItem('watschn-ton')!=='aus'}catch(e){}
function tonInit(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=laut?.5:0;master.connect(ac.destination);
    naechste=ac.currentTime+.1;musik=setInterval(takt,90);
  }catch(e){ac=null}
}
function ton(f,t,d,typ,v){const o=ac.createOscillator(),g=ac.createGain();o.type=typ||'square';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);return o}
function rausch(t,d,freq,typ,v){const n=Math.floor(ac.sampleRate*d),buf=ac.createBuffer(1,n,ac.sampleRate),da=buf.getChannelData(0);
  for(let i=0;i<n;i++)da[i]=Math.random()*2-1;const src=ac.createBufferSource();src.buffer=buf;
  const fl=ac.createBiquadFilter();fl.type=typ||'bandpass';fl.frequency.value=freq;const g=ac.createGain();
  g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);src.connect(fl);fl.connect(g);g.connect(master);src.start(t)}
const mf=m=>440*Math.pow(2,(m-69)/12);
/* eigene kleine Polka: 16 Takte, je vier Achtel */
const AKK=[[48,[64,67,72]],[48,[64,67,72]],[43,[62,65,71]],[43,[62,65,71]],[43,[62,65,71]],[43,[62,65,71]],[48,[64,67,72]],[48,[64,67,72]],
           [41,[65,69,72]],[41,[65,69,72]],[48,[64,67,72]],[48,[64,67,72]],[43,[62,65,71]],[43,[62,65,71]],[48,[64,67,72]],[48,[64,67,72]]];
const MEL=[[76,79,76,72],[76,79,84,79],[74,77,74,71],[74,79,77,74],[71,74,77,74],[79,77,74,71],[72,76,79,76],[72,0,72,0],
           [81,77,81,84],[81,77,72,77],[79,76,79,84],[79,76,72,76],[77,74,71,74],[79,77,74,71],[72,76,72,67],[72,0,84,0]];
function takt(){
  if(!ac||!S||!S.pick)return;
  const frac=Math.max(0,Math.min(S.f[0].hp,S.f[1].hp))/100, bpm=104+(1-frac)*76, ach=60/bpm/2;
  if(naechste<ac.currentTime)naechste=ac.currentTime+.05;
  while(naechste<ac.currentTime+.25){
    const bar=Math.floor(schritt/4)%16,i=schritt%4,t=naechste,a=AKK[bar];
    if(i===0)ton(mf(a[0]),t,ach*1.4,'triangle',.16);
    if(i===2)ton(mf(a[0]+7),t,ach*1.4,'triangle',.14);
    if(i===1||i===3)a[1].forEach(n=>ton(mf(n),t,ach*.7,'square',.022));
    const m=MEL[bar][i];if(m)ton(mf(m),t,ach*.9,'square',.045);
    naechste+=ach;schritt++;
  }
}
const SFX={
  slap(){rausch(ac.currentTime,.12,1800,'bandpass',.7);ton(140,ac.currentTime,.1,'sine',.25)},
  plop(){const o=ton(320,ac.currentTime,.16,'sine',.3);o.frequency.exponentialRampToValueAtTime(70,ac.currentTime+.15)},
  bell(){const t=ac.currentTime;[620,930,1480,2050].forEach((f,i)=>ton(f,t,.9-i*.15,'sine',.12))},
  miss(){rausch(ac.currentTime,.22,600,'lowpass',.25)},
  jodel(){const t=ac.currentTime;[[523,0],[784,.14],[523,.28],[880,.42],[659,.56],[1047,.7]].forEach(p=>ton(p[0],t+p[1],.16,'sine',.2))},
  rumpel(){rausch(ac.currentTime,1,120,'lowpass',.9)},
  prost(){const t=ac.currentTime;ton(1568,t,.5,'sine',.15);ton(2093,t+.05,.5,'sine',.1)},
  donner(){rausch(ac.currentTime,.9,90,'lowpass',.9)},
  klick(){ton(2400,ac.currentTime,.05,'square',.08)},
  sieg(){const t=ac.currentTime;[523,659,784,1047].forEach((f,i)=>ton(f,t+i*.14,.3,'square',.09))},
  pech(){const t=ac.currentTime;[392,370,349,294].forEach((f,i)=>ton(f,t+i*.24,.34,'sawtooth',.07))}
};
function sfx(n){if(ac&&SFX[n])try{SFX[n]()}catch(e){}}
function tonKnopf(){$('ton').textContent=laut?'Ton aus':'Ton an'}
$('ton').addEventListener('click',()=>{laut=!laut;if(master)master.gain.value=laut?.5:0;if(laut)tonInit();
  try{localStorage.setItem('watschn-ton',laut?'an':'aus')}catch(e){}tonKnopf()});

/* ---------- Anzeige ---------- */
function zeig(ko){
  for(let i=0;i<2;i++){
    const f=S.f[i];
    $('n'+i).innerHTML=i===0?NAME[f.kind]+(S.pick?'<small>du</small>':''):(S.pick?'<small>Computer</small>':'')+NAME[f.kind];
    $('hp'+i).style.width=Math.max(0,f.hp)+'%';
    $('sp'+i).style.width=f.sp+'%';
    $('spb'+i).classList.toggle('voll',f.sp>=100);
    $('z'+i).textContent='Schneid '+Math.max(0,f.hp)+' · Spezial '+Math.round(f.sp)+' %';
    let c='';if(f.half)c+='<span class="chip">'+f.half+'</span>';if(f.shaky)c+='<span class="chip">'+f.shaky+'</span>';if(f.dbl)c+='<span class="chip gut">Schilcher-Mut</span>';
    $('c'+i).innerHTML=c;
    $('f'+i).innerHTML=figur(f,ko===i);
  }
  $('stand').textContent=S.pick?'Runde '+S.round+' · '+S.wins[0]+' : '+S.wins[1]:'';
}
function log(t){$('log').textContent=t}
function sag(i,t,ms){const b=$('b'+i);b.textContent=t;b.classList.add('an');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('an'),ms||1300)}
function muh(){const b=$('muh');b.textContent=rnd(['Muh.','Muh?!','Muuuh!','Mahlzeit.']);b.classList.add('an');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('an'),1300)}
function schweb(i,t,cls){const e=document.createElement('div');e.className='schweb '+(cls||'');e.textContent=t;e.style.left=(i===0?23:77)+'%';
  $('buehne').appendChild(e);const a=e.animate([{transform:'translate(-50%,0)',opacity:1},{transform:'translate(-50%,-90%)',opacity:0}],{duration:1000,easing:'ease-out'});a.onfinish=()=>e.remove()}
function wackel(i){$('k'+i).animate([{transform:'translateX(0)'},{transform:'translateX(-6%)'},{transform:'translateX(6%)'},{transform:'translateX(-4%)'},{transform:'translateX(0)'}],{duration:320})}
function vor(i){const d=i===0?1:-1;return $('k'+i).animate([{transform:'translateX(0)'},{transform:'translateX('+d*45+'%) rotate('+d*8+'deg)'},{transform:'translateX(0)'}],{duration:420,easing:'ease-in-out'}).finished}
function flug(a,what,miss,delay){
  const e=document.createElement('div');e.className='proj';if(what==='oel')e.classList.add('oel');else e.textContent=what;
  const x0=a===0?30:70,x1=miss?(a===0?108:-8):(a===0?76:24);
  e.style.left=x0+'%';e.style.top='55%';$('buehne').appendChild(e);
  const an=e.animate([{left:x0+'%',top:'55%',transform:'translate(-50%,-50%) rotate(0)'},{left:(x0+x1)/2+'%',top:'28%',transform:'translate(-50%,-50%) rotate(200deg)'},{left:x1+'%',top:miss?'70%':'48%',transform:'translate(-50%,-50%) rotate(400deg)'}],{duration:480,delay:delay||0,fill:'both',easing:'linear'});
  return an.finished.then(()=>e.remove());
}
async function blitz(n){const b=$('blitz');for(let i=0;i<n;i++){await b.animate([{opacity:.9},{opacity:0}],{duration:180}).finished}}
function banner(html){const b=$('banner');b.innerHTML=html;b.hidden=false}

/* ---------- Timing ---------- */
let stopp=null;
function timing(m,shaky){
  return new Promise(res=>{
    const hw=HITW[m.diff],kw=CRITW[m.diff];
    $('aktionen').hidden=true;$('timing').hidden=false;
    $('spur').style.setProperty('--t',hw*100+'%');$('spur').style.setProperty('--k',kw*100+'%');
    $('thin').textContent=m.name+': stopp den Zeiger möglichst in der Mitte.'+(shaky?' Du bist gerade „'+shaky+'“, der Zeiger rennt schneller.':'');
    let p=Math.random()<.5?0:1,dir=p?-1:1,last=performance.now(),lauf=true;
    const v=(1.05+m.diff*.3)*(shaky?1.7:1),z=$('zeiger');
    function tick(t){if(!lauf)return;const dt=Math.min(.05,(t-last)/1000);last=t;p+=dir*v*dt;if(p>1){p=1;dir=-1}if(p<0){p=0;dir=1}z.style.left=p*100+'%';requestAnimationFrame(tick)}
    requestAnimationFrame(tick);
    stopp=async()=>{if(!lauf)return;lauf=false;stopp=null;sfx('klick');const d=Math.abs(p-.5);await sleep(280);$('timing').hidden=true;res(d<kw/2?'crit':d<hw/2?'hit':'miss')};
    $('hau').focus({preventScroll:true});
  });
}
$('hau').addEventListener('click',()=>{if(stopp)stopp()});
document.addEventListener('keydown',e=>{if((e.code==='Space')&&stopp){e.preventDefault();if(e.target!==$('hau'))stopp()}});

/* ---------- Kampf ---------- */
function aktionen(){
  const me=S.f[0],box=$('aktionen');box.innerHTML='';
  MOVES[me.kind].forEach((m,i)=>{
    const b=document.createElement('button');b.type='button';b.id='akt'+i;b.className='akt'+(m.special?' spezial':'');
    let meta;
    if(m.special){const ok=me.sp>=100;b.disabled=!ok;if(ok)b.classList.add('bereit');meta=ok?'Spezial bereit':'Spezial lädt: '+Math.round(me.sp)+' %';}
    else meta='Schaden '+m.dmg+' · '+DIFF[m.diff];
    b.innerHTML='<b>'+m.name+'</b><span>'+m.desc+'</span><em>'+meta+'</em>';
    b.addEventListener('click',()=>waehle(i));box.appendChild(b);
  });
  box.hidden=false;
}
function schaden(att,m,res){
  let d=m.dmg*(res==='crit'?1.5:1);
  if(att.half)d*=.5;if(att.dbl)d*=2;
  return Math.max(1,Math.round(d+Math.random()*3-1));
}
async function fuehrAus(a,m,res){
  const att=S.f[a],tgt=S.f[1-a],wer=NAME[att.kind];
  sag(a,m.special==='lawine'?'Holadaridiii!':m.special==='schank'?'Erst amol a Jausn.':rnd(SPOTT[att.kind]));
  await sleep(750);
  if(m.special==='schank'){
    att.sp=0;att.hp=Math.min(100,att.hp+m.heal);att.dbl=true;att.half=false;att.face=null;
    sfx('prost');schweb(a,'+'+m.heal,'heil');zeig();
    log(wer+' macht Brettljause: +'+m.heal+' Schneid, und der nächste Schlag zählt doppelt.');
    await sleep(900);return;
  }
  let d=0;
  if(m.special==='lawine'){
    att.sp=0;sfx('jodel');await sleep(700);sfx('rumpel');
    const e=document.createElement('div');e.className='lawine';$('buehne').appendChild(e);
    const von=a===0?-40:106,bis=a===0?106:-40;
    if(!RM)$('buehne').animate([{transform:'translate(0,0)'},{transform:'translate(-4px,3px)'},{transform:'translate(4px,-3px)'},{transform:'translate(0,0)'}],{duration:160,iterations:5});
    await e.animate([{left:von+'%',transform:'rotate(0)'},{left:bis+'%',transform:'rotate('+(a===0?720:-720)+'deg)'}],{duration:900,easing:'ease-in'}).finished;e.remove();
    d=schaden(att,m,'hit');res='hit';
  }else{
    const n=m.multi||1,ps=[];
    if(m.proj){for(let i=0;i<n;i++)ps.push(flug(a,m.proj,res==='miss',i*110));vor(a);await Promise.all(ps);}
    else await vor(a);
    if(res==='miss'){
      sfx('miss');schweb(1-a,'daneben','fehl');att.half=false;att.dbl=false;att.face=null;zeig();
      log(wer+' haut mit „'+m.name+'“ daneben.');sag(1-a,rnd(['Ha!','Daneben!','Brille vergessen?']),900);
      await sleep(900);return;
    }
    d=schaden(att,m,res);sfx(m.sfx);
  }
  att.half=false;att.dbl=false;att.face=null;
  tgt.hp-=d;tgt.minHp=Math.min(tgt.minHp,Math.max(0,tgt.hp));
  att.sp=Math.min(100,att.sp+d*1.4);tgt.sp=Math.min(100,tgt.sp+d*.9);
  if(m.fx)tgt[m.fx]=m.fxName;if(m.oil)tgt.oil=true;if(m.face)tgt.face=m.face;
  wackel(1-a);schweb(1-a,'−'+d);zeig();
  if(tgt.hp>0)sag(1-a,rnd(AUA),900);
  if(res==='crit'){muh();log('Volltreffer! '+wer+' trifft mit „'+m.name+'“: −'+d+' Schneid.');}
  else log(wer+' trifft mit „'+m.name+'“: −'+d+' Schneid.'+(m.fx?' Der Gegner ist jetzt „'+m.fxName+'“.':''));
  await sleep(950);
}
async function ende(){
  const v=S.f[0].hp<=0?0:S.f[1].hp<=0?1:-1;if(v<0)return false;
  const sieger=1-v;S.wins[sieger]++;zeig(v);$('aktionen').hidden=true;
  await sleep(900);
  if(S.wins[sieger]>=2){
    sfx(sieger===0?'sieg':'pech');
    banner('<h2>'+(sieger===0?'Gewonnen!':'Verloren!')+'</h2><p>'+NAME[S.f[sieger].kind]+' gewinnt '+S.wins[sieger]+' : '+S.wins[v]+'. Der Verlierer zahlt die Runde Schnaps. Danach schimpfen beide gemeinsam über die Wiener.</p><div class="reihe"><button class="haupt" id="revanche" type="button">Revanche</button><button class="klein" id="wechsel" type="button">Figur wechseln</button></div>');
    $('revanche').addEventListener('click',()=>start(S.pick));
    $('wechsel').addEventListener('click',zurWahl);
    log(sieger===0?'Du hast das Duell gewonnen.':'Der Computer hat das Duell gewonnen.');
    return true;
  }
  S.round++;
  banner('<h2>Runde '+S.round+'</h2><p>'+NAME[S.f[sieger].kind]+' holt sich die Runde. Stand '+S.wins[0]+' : '+S.wins[1]+'.</p>');
  await sleep(1700);$('banner').hidden=true;
  S.f.forEach(f=>{f.hp=100;f.half=false;f.shaky=false;f.dbl=false;f.face=null});
  zeig();log('Neue Runde. Die Beulen bleiben. Du bist dran.');
  S.busy=false;aktionen();
  return true;
}
async function zufall(){
  if(Math.random()<.5){
    log('Ein Gewitter zieht auf. Beide werden nass und verlieren 5 Schneid.');sfx('donner');await blitz(2);
    S.f.forEach(f=>{f.hp=Math.max(1,f.hp-5);f.minHp=Math.min(f.minHp,f.hp)});schweb(0,'−5');schweb(1,'−5');
  }else{
    log('Ein Tourist fotografiert die beiden. Vor Stolz laden sich die Spezialleisten um 15 % auf.');sfx('klick');await blitz(1);
    S.f.forEach(f=>{f.sp=Math.min(100,f.sp+15)});sag(0,'Cheese!',900);sag(1,'Servas!',900);
  }
  zeig();await sleep(1300);
}
async function waehle(i){
  if(S.busy)return;
  const me=S.f[0],m=MOVES[me.kind][i];if(m.special&&me.sp<100)return;
  S.busy=true;tonInit();
  let res='hit';
  if(!m.special){res=await timing(m,me.shaky);}
  $('aktionen').hidden=true;me.shaky=false;
  await fuehrAus(0,m,res);S.turns++;
  if(await ende())return;
  await sleep(350);
  /* Computer */
  const cpu=S.f[1],ms=MOVES[cpu.kind];let cm;
  if(cpu.sp>=100&&(cpu.kind==='tirol'||cpu.hp<80||Math.random()<.4))cm=ms[3];else cm=ms[Math.floor(Math.random()*3)];
  let cr='hit';
  if(!cm.special){const r=Math.random(),mp=[.1,.22,.36][cm.diff]+(cpu.shaky?.22:0);cr=r<mp?'miss':r<mp+[.15,.13,.12][cm.diff]?'crit':'hit';}
  cpu.shaky=false;
  await fuehrAus(1,cm,cr);
  if(await ende())return;
  if(Math.random()<.14)await zufall();
  S.busy=false;aktionen();
}

/* ---------- Ablauf ---------- */
function start(pick){
  tonInit();frisch(pick);
  $('banner').hidden=true;$('wahlbox').hidden=true;$('timing').hidden=true;
  zeig();log('Runde 1. Du bist dran: such dir einen Schlag aus.');
  S.busy=false;aktionen();
}
function zurWahl(){
  frisch(null);$('banner').hidden=true;$('aktionen').hidden=true;$('timing').hidden=true;$('wahlbox').hidden=false;
  zeig();log('Such dir aus, für wen du zuhaust.');
}
$('wahl-tirol').addEventListener('click',()=>start('tirol'));
$('wahl-steier').addEventListener('click',()=>start('steier'));
$('wf-tirol').innerHTML=figur(neu('tirol'));$('wf-steier').innerHTML=figur(neu('steier'));
tonKnopf();

function boot(data){
  if(data&&data.pick&&data.f&&data.wins&&Math.max(data.wins[0],data.wins[1])<2&&data.f[0].hp>0&&data.f[1].hp>0){
    S={pick:data.pick,round:data.round||1,wins:data.wins,turns:data.turns||0,busy:false,f:data.f};
    $('wahlbox').hidden=true;zeig();log('Weiter gehts. Du bist dran.');aktionen();
  }else zurWahl();
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>S&&S.pick?{pick:S.pick,round:S.round,wins:S.wins,turns:S.turns,f:S.f}:{});
if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});
})();
</script>
